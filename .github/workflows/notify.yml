name: Yonsei GSE Notice Monitor

on:
  schedule:
    # 매일 KST 오전 10시
    # GitHub Actions는 UTC 기준
    - cron: "0 1 * * *"

  workflow_dispatch:


# last_post.txt를 GitHub에 commit/push하기 위해 필요
permissions:
  contents: write


jobs:
  check-notice:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # ------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai


      # ------------------------------------------------------
      # Crawler
      # ------------------------------------------------------

      - name: Run crawler

        env:

          # Kakao
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}

          # Yonsei
          BOARD_URL: ${{ secrets.BOARD_URL }}

          # Gemini
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

          # State file
          LAST_POST_FILE: ${{ secrets.LAST_POST_FILE }}

        run: |
          python crawler.py


      # ------------------------------------------------------
      # Save last_post.txt
      # ------------------------------------------------------

      - name: Commit and push state file

        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add last_post.txt


          if git diff --cached --quiet; then

            echo "last_post.txt 변경 없음"

          else

            git commit \
              -m "chore: update last post id"

            git push

          fi